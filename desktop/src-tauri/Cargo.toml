[package]
name = "sleipnir-desktop"
version = "0.1.0"
description = "Native Sleipnir operator workbench"
authors = ["Sleipnir contributors"]
edition = "2021"

[lib]
name = "sleipnir_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
