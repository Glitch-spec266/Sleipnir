<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">Sleipnir</title>
  <desc id="desc">A circular green mark with eight radial spokes beside the Sleipnir wordmark.</desc>

  <rect width="760" height="260" rx="24" fill="#06110C"/>

  <!-- Eight equal spokes: cardinal directions plus diagonals. -->
  <g fill="none" stroke="#42E982" stroke-width="12" stroke-linecap="square">
    <path d="M136 76V24M170 90l37-37M184 124h52M170 158l37 37M136 172v52M102 158l-37 37M88 124H36M102 90 65 53"/>
  </g>
  <circle cx="136" cy="124" r="42" fill="#06110C" stroke="#DFFFF0" stroke-width="12"/>

  <g font-family="DejaVu Sans, ui-sans-serif, system-ui, sans-serif">
    <text x="294" y="127" fill="#E8FFF0" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="70" font-weight="700" letter-spacing="5">SLEIPNIR</text>
    <text x="299" y="169" fill="#69D994" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="16" font-weight="700" letter-spacing="4.2">EIGHT-LANE ORCHESTRATION</text>
  </g>
</svg>
