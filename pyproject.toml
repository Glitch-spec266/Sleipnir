[project]
name = "sleipnir"
version = "0.1.0"
description = "Budget-aware agentic orchestrator: decompose a prompt into a task DAG, dispatch each task to the cheapest tier that can do it, keep the orchestrator's context flat."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Browser control is optional on purpose: the orchestrator, the console and the
# whole test suite run without it, and a headless server has no use for a
# Chromium download. `sleipnir setup` installs this when host control is wanted.
host = [
    "playwright>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
sleipnir = "sleipnir.cli:main"
orch = "sleipnir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleipnir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
