[project]
name = "sleipnir"
version = "0.1.0"
description = "Budget-aware agentic orchestrator: decompose a prompt into a task DAG, dispatch each task to the cheapest tier that can do it, keep the orchestrator's context flat."
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    # A public party relay must never carry plaintext or unauthenticated
    # hierarchy messages. Party is a first-class console feature, so its AEAD
    # and signature implementation ships with the normal installation.
    "cryptography>=46",
    # Every dependency above is pure Python and cross-platform, so none carries
    # an environment marker.  One wheel serves Linux, Windows and macOS because
    # the OS-specific backends in `sleipnir.platform` are `ctypes`, not compiled
    # extensions.  The first dependency that is NOT available everywhere must be
    # added with an explicit `; sys_platform == "..."` marker -- without one it
    # installs on all three and fails at import on two.
]

[project.optional-dependencies]
# Browser control is optional on purpose: the orchestrator, the console and the
# whole test suite run without it, and a headless server has no use for a
# Chromium download. `sleipnir setup` installs this when host control is wanted.
host = [
    "playwright>=1.40",
]
[dependency-groups]
dev = [
    "pytest>=8",
]

[project.scripts]
sleipnir = "sleipnir.cli:main"
orch = "sleipnir.cli:main"

[project.urls]
Homepage = "https://github.com/Glitch-spec266/Sleipnir"
Repository = "https://github.com/Glitch-spec266/Sleipnir"
Issues = "https://github.com/Glitch-spec266/Sleipnir/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleipnir"]

# A source archive should be small, reproducible, and safe to publish.  In
# particular, it must not accidentally ship local run data, design scratchwork,
# browser transcripts, or generated reports that happen to be in a checkout.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/sleipnir",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
