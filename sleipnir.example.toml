# Sleipnir configuration.
#
# Sleipnir ships NO model names and NO prices. Everything below is yours to
# set, and the live OpenRouter catalogue supplies context windows and pricing
# at runtime. Copy this to sleipnir.toml and edit.

concurrency = 3
catalog_ttl_s = 21600          # 6h; the catalogue is re-fetched after this
reserve_fraction = 0.10        # keep 10% of the window unspent

# Leave unset until you know what your plan actually meters. With no limit the
# governor reports burn rate but will not invent headroom it cannot verify.
# window_tokens_limit = 20_000_000
# metered_budget_usd = 25.0

# --- backends --------------------------------------------------------------
# Additional API endpoints may use `adapter = "openai"` for an
# OpenAI-compatible chat-completions service (including hosted NIM), or
# `adapter = "anthropic"` for the Messages API. Set `base_url` and
# `api_key_env = "NAME_OF_ENV_VAR"`; never put the key itself in this file.
# A metered model absent from the live OpenRouter catalogue also needs local
# `context` and `price_per_mtok` metadata or routing safely refuses it.

[[backends]]
name = "claude-sub"
adapter = "claude"
billing = "subscription"       # spends window quota, not dollars
# MEASURED: every `claude -p` spawn carries ~30k cache-creation tokens of
# system-prompt overhead before it does any work. That is why routing a
# trivial mechanical task here can cost more than the work is worth.
dispatch_overhead_tokens = 30000
# Ordered by preference — cheapest last is NOT assumed, you decide.
# `context` is a local hint for models the OpenRouter catalogue does not list.
models = [
    { id = "opus" },
    { id = "sonnet" },
    { id = "haiku" },
]

[[backends]]
name = "openrouter"
adapter = "openrouter"
billing = "metered"            # spends dollars, not window quota
dispatch_overhead_tokens = 0
# Explicit model IDs are a trust boundary: the live catalogue supplies metadata
# and prices, but it must never select what Sleipnir dispatches. Replace this
# placeholder with models you have approved for metered work.
models = [{ id = "replace/with-an-approved-model" }]

[[backends]]
name = "codex-sub"
adapter = "codex"
billing = "subscription"
# MEASURED on CLI 0.153.3: a `codex exec` dispatch that wrote a 9-byte file
# from an 847-byte prompt reported 66,944 tokens — 59,392 of them cache reads
# before any work. A second run of two trivial tasks came to 171,648. The floor
# is more than twice `claude -p`'s, so declaring it as zero told the router a
# Codex dispatch was free of fixed cost and made it the cheap-looking choice
# for exactly the small tasks where the floor is the whole bill.
dispatch_overhead_tokens = 60000
# Bulk code goes here before Claude so the scarce Claude window is reserved for
# decomposition and control. This sentinel deliberately omits `--model`, so
# the authenticated Codex CLI uses the account's current supported default.
# Pin a concrete model id here instead when reproducibility matters more.
models = [{ id = "@cli-default" }]

# --- tiers -----------------------------------------------------------------
# `prefer` is an ordered list of backends. The first backend with a candidate
# that satisfies the tier wins; within an explicit model list, config order is
# the retry rotation order.

[tiers.reason]
prefer = ["claude-sub", "openrouter"]
min_context = 100000
require_parameters = ["reasoning"]
output_ratio = 0.35

[tiers.code]
prefer = ["codex-sub", "openrouter", "claude-sub"]
min_context = 64000
output_ratio = 0.30

[tiers.mechanical]
# Deliberately NOT claude-sub first: the ~30k fixed spawn overhead dwarfs the
# work for renames and formatting. Metered models have no such floor.
prefer = ["openrouter", "codex-sub", "claude-sub"]
min_context = 16000
max_price_per_mtok = 0.60
output_ratio = 0.25

[tiers.extract]
prefer = ["openrouter", "codex-sub", "claude-sub"]
min_context = 32000
max_price_per_mtok = 1.50
output_ratio = 0.15

[tiers.longctx]
# longctx is excluded from the downshift ladder on purpose: moving a task off
# it is not a cost saving, it is a correctness failure.
prefer = ["openrouter", "claude-sub"]
min_context = 400000
output_ratio = 0.10
